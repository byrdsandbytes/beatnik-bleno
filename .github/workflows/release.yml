name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies and pack
        run: |
          npm ci
          npm run pack-pi
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: beatnik-bleno.tar.gz
