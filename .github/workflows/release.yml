name: Build and Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Native ARM runner: @abandonware/bleno has native modules that must match the Pi
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: System build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libudev-dev libusb-1.0-0-dev

      - name: Build
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Build Debian package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ROOT=package_root
          APP=$ROOT/opt/beatnik-bleno

          mkdir -p $APP $ROOT/etc/systemd/system $ROOT/DEBIAN
          cp -r dist node_modules package.json $APP/
          cp beatnik-bleno.service $ROOT/etc/systemd/system/
          cp packaging/postinst packaging/prerm packaging/postrm $ROOT/DEBIAN/

          cat > $ROOT/DEBIAN/control <<CONTROL
          Package: beatnik-bleno
          Version: ${VERSION}
          Section: misc
          Priority: optional
          Architecture: arm64
          Depends: nodejs (>= 22), bluez, network-manager, libudev1, libusb-1.0-0, rfkill
          Maintainer: Jonathan Gerber <noreply@example.com>
          Description: BLE WiFi provisioning service for Beatnik devices
          CONTROL
          sed -i 's/^ *//' $ROOT/DEBIAN/control

          dpkg-deb --root-owner-group --build $ROOT beatnik-bleno_${VERSION}_arm64.deb

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: beatnik-bleno_*_arm64.deb
